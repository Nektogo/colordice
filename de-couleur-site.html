<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b10">
  <title>Dé Couleur</title>

  <style>
    :root {
      --background: #090b10;
      --surface: #10141d;
      --surface-soft: #151a25;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f6f7fb;
      --muted: #969dab;
      --accent: #ffb000;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(73, 100, 180, 0.12), transparent 34%),
        var(--background);
    }

    button {
      font: inherit;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      background: rgba(9, 11, 16, 0.88);
      backdrop-filter: blur(14px);
    }

    .nav {
      width: min(1120px, calc(100% - 32px));
      height: 74px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 20px;
      font-weight: 800;
    }

    .logo-mark {
      width: 31px;
      height: 31px;
      border-radius: 10px;
      background:
        linear-gradient(135deg, #ff375f 0 24%, #ffcc00 24% 48%, #34c759 48% 72%, #0a84ff 72%);
      transform: rotate(-8deg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: #b1b6c2;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: white;
    }

    .header-button {
      border: 0;
      border-radius: 999px;
      padding: 12px 19px;
      font-weight: 800;
      color: #111;
      background: #f3f1eb;
      cursor: pointer;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: auto;
      padding: 72px 0;
    }

    .hero {
      max-width: 760px;
      margin: 0 auto 42px;
      text-align: center;
    }

    .tag {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 15px;
      border: 1px solid rgba(255, 176, 0, .28);
      border-radius: 999px;
      color: #ffc54f;
      background: rgba(255, 176, 0, .06);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 9vw, 104px);
      line-height: .95;
      letter-spacing: -.065em;
    }

    .hero p {
      max-width: 640px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .game {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.018), transparent 30%),
        var(--surface);
      box-shadow: 0 28px 90px rgba(0,0,0,.42);
    }

    .game-display {
      min-height: 410px;
      padding: 34px 30px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .game-info {
      margin-bottom: 28px;
      color: #707785;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .dice-list {
      min-height: 155px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 22px;
    }

    .die-item {
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    .die {
      width: clamp(78px, 10vw, 104px);
      aspect-ratio: 1;
      border-radius: 23%;
      background: var(--die-color);
      box-shadow:
        inset 0 2px 1px rgba(255,255,255,.45),
        inset 0 -12px 22px rgba(0,0,0,.18),
        0 16px 34px rgba(0,0,0,.35);
      position: relative;
      overflow: hidden;
    }

    .die::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 30% 18%, rgba(255,255,255,.62), transparent 34%),
        linear-gradient(145deg, rgba(255,255,255,.18), transparent 44%);
    }

    .die-name {
      color: #adb3c0;
      font-size: 13px;
      font-weight: 700;
    }

    .rolling {
      animation: rolling .55s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes rolling {
      0% { transform: rotate(0) scale(1); }
      35% { transform: rotate(-12deg) scale(.87); }
      70% { transform: rotate(9deg) scale(1.08); }
      100% { transform: rotate(0) scale(1); }
    }

    .game-actions {
      margin-top: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .small-button,
    .roll-button {
      border: 1px solid rgba(255,255,255,.13);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .small-button {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      color: #b0b5c1;
      background: rgba(255,255,255,.025);
    }

    .small-button:hover {
      color: white;
      background: rgba(255,255,255,.06);
    }

    .roll-button {
      min-width: 190px;
      min-height: 58px;
      border-radius: 999px;
      border-color: transparent;
      color: #171717;
      background: #f5f2eb;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 14px 32px rgba(255,255,255,.1);
    }

    .roll-button:hover,
    .header-button:hover {
      transform: translateY(-2px);
    }

    .settings {
      border-top: 1px solid var(--border);
      padding: 25px 28px 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 34px;
      background: rgba(0,0,0,.08);
    }

    .setting-title {
      margin-bottom: 12px;
      color: #747b89;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .dice-count {
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      background: rgba(255,255,255,.02);
    }

    .count-button {
      min-height: 46px;
      border: 0;
      border-radius: 11px;
      color: #8f96a4;
      background: transparent;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .count-button.active {
      color: #161616;
      background: #f3f1eb;
    }

    .colors {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 9px;
    }

    .color-preview {
      min-height: 50px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 13px;
      background: var(--color);
      box-shadow:
        inset 0 1px rgba(255,255,255,.4),
        inset 0 -10px 18px rgba(0,0,0,.15);
    }

    .footer-note {
      margin-top: 20px;
      color: #616876;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .nav-links {
        display: none;
      }

      main {
        padding-top: 48px;
      }

      .settings {
        grid-template-columns: 1fr;
      }

      .game-display {
        padding-inline: 18px;
      }

      .game-actions {
        flex-wrap: wrap;
      }

      .roll-button {
        order: -1;
        flex-basis: 100%;
      }
    }

    @media (max-width: 440px) {
      .header-button {
        display: none;
      }

      .colors {
        grid-template-columns: repeat(3, 1fr);
      }

      .die {
        width: 72px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <nav class="nav">
      <div class="logo">
        <span class="logo-mark"></span>
        <span>Dé Couleur</span>
      </div>

      <div class="nav-links">
        <a href="#accueil">Accueil</a>
        <a href="#jeu">Jouer</a>
        <a href="#reglages">Réglages</a>
      </div>

      <button class="header-button" id="headerRoll" type="button">
        Jouer maintenant
      </button>
    </nav>
  </header>

  <main id="accueil">
    <section class="hero">
      <div class="tag">Jeu de couleurs</div>
      <h1>Lance tes couleurs</h1>
      <p>
        Sélectionne le nombre de dés, lance la partie et découvre une nouvelle
        combinaison colorée à chaque tour.
      </p>
    </section>

    <section class="game" id="jeu">
      <div class="game-display">
        <div class="game-info" id="gameInfo">3 dés sélectionnés</div>

        <div class="dice-list" id="diceList" aria-live="polite"></div>

        <div class="game-actions">
          <button class="small-button" id="resetButton" type="button" title="Réinitialiser">
            ↶
          </button>

          <button class="roll-button" id="rollButton" type="button">
            🎲&nbsp;&nbsp;Lancer les dés
          </button>

          <button class="small-button" id="copyButton" type="button" title="Copier le résultat">
            ⧉
          </button>
        </div>

        <div class="footer-note">
          Tu peux aussi appuyer sur la barre d’espace.
        </div>
      </div>

      <div class="settings" id="reglages">
        <div>
          <div class="setting-title">Nombre de dés</div>

          <div class="dice-count">
            <button class="count-button" type="button" data-count="2">2</button>
            <button class="count-button active" type="button" data-count="3">3</button>
            <button class="count-button" type="button" data-count="4">4</button>
          </div>
        </div>

        <div>
          <div class="setting-title">Couleurs du jeu</div>

          <div class="colors">
            <div class="color-preview" style="--color:#ff453a" title="Rouge"></div>
            <div class="color-preview" style="--color:#ffd60a" title="Jaune"></div>
            <div class="color-preview" style="--color:#32d74b" title="Vert"></div>
            <div class="color-preview" style="--color:#0a84ff" title="Bleu"></div>
            <div class="color-preview" style="--color:#bf5af2" title="Violet"></div>
            <div class="color-preview" style="--color:#ff9f0a" title="Orange"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const colors = [
      { name: "Rouge", value: "#ff453a" },
      { name: "Jaune", value: "#ffd60a" },
      { name: "Vert", value: "#32d74b" },
      { name: "Bleu", value: "#0a84ff" },
      { name: "Violet", value: "#bf5af2" },
      { name: "Orange", value: "#ff9f0a" }
    ];

    let diceCount = 3;
    let currentResult = [];

    const diceList = document.getElementById("diceList");
    const gameInfo = document.getElementById("gameInfo");
    const rollButton = document.getElementById("rollButton");
    const resetButton = document.getElementById("resetButton");
    const copyButton = document.getElementById("copyButton");
    const headerRoll = document.getElementById("headerRoll");
    const countButtons = document.querySelectorAll(".count-button");

    function getRandomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function createDie(color, animate) {
      const item = document.createElement("div");
      item.className = "die-item";

      const die = document.createElement("div");
      die.className = "die";
      die.style.setProperty("--die-color", color.value);

      if (animate) {
        die.classList.add("rolling");
      }

      const name = document.createElement("div");
      name.className = "die-name";
      name.textContent = color.name;

      item.append(die, name);
      return item;
    }

    function displayResult(animate = false) {
      diceList.innerHTML = "";

      currentResult.forEach(color => {
        diceList.appendChild(createDie(color, animate));
      });

      gameInfo.textContent = `${diceCount} dés sélectionnés`;
    }

    function rollDice() {
      currentResult = Array.from({ length: diceCount }, getRandomColor);
      displayResult(true);
    }

    function resetDice() {
      currentResult = Array.from(
        { length: diceCount },
        (_, index) => colors[index % colors.length]
      );

      displayResult(false);
    }

    function changeDiceCount(newCount) {
      diceCount = newCount;

      countButtons.forEach(button => {
        button.classList.toggle(
          "active",
          Number(button.dataset.count) === diceCount
        );
      });

      rollDice();
    }

    async function copyResult() {
      const resultText = currentResult
        .map(color => color.name)
        .join(" - ");

      try {
        await navigator.clipboard.writeText(
          `Résultat Dé Couleur : ${resultText}`
        );

        const oldText = copyButton.textContent;
        copyButton.textContent = "✓";

        setTimeout(() => {
          copyButton.textContent = oldText;
        }, 1200);
      } catch {
        alert(`Résultat : ${resultText}`);
      }
    }

    countButtons.forEach(button => {
      button.addEventListener("click", () => {
        changeDiceCount(Number(button.dataset.count));
      });
    });

    rollButton.addEventListener("click", rollDice);
    resetButton.addEventListener("click", resetDice);
    copyButton.addEventListener("click", copyResult);

    headerRoll.addEventListener("click", () => {
      document.getElementById("jeu").scrollIntoView({ behavior: "smooth" });
      setTimeout(rollDice, 350);
    });

    document.addEventListener("keydown", event => {
      if (event.code === "Space") {
        event.preventDefault();
        rollDice();
      }
    });

    resetDice();
  </script>
</body>
</html>
