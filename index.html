<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b10">
  <meta
    name="description"
    content="Dé Couleur : lancez 2, 3 ou 4 dés et obtenez une combinaison de couleurs."
  >

  <title>Dé Couleur</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="header">
    <nav class="nav" aria-label="Navigation principale">
      <a class="logo" href="#accueil" aria-label="Retour à l'accueil">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>Dé Couleur</span>
      </a>

      <div class="nav-links">
        <a href="#accueil">Accueil</a>
        <a href="#jeu">Jouer</a>
        <a href="#reglages">Réglages</a>
      </div>

      <button class="header-button" id="headerRoll" type="button">
        Jouer maintenant
      </button>
    </nav>
  </header>

  <main id="accueil">
    <section class="hero" aria-labelledby="page-title">
      <div class="tag">Jeu de couleurs</div>

      <h1 id="page-title">Lance tes couleurs</h1>

      <p>
        Sélectionne le nombre de dés, lance la partie et découvre une nouvelle
        combinaison colorée à chaque tour.
      </p>
    </section>

    <section class="game" id="jeu" aria-label="Lanceur de dés de couleur">
      <div class="game-display">
        <div class="game-info" id="gameInfo">3 dés sélectionnés</div>

        <div class="dice-list" id="diceList" aria-live="polite"></div>

        <div class="game-actions">
          <button
            class="small-button"
            id="resetButton"
            type="button"
            title="Réinitialiser"
            aria-label="Réinitialiser les dés"
          >
            ↶
          </button>

          <button class="roll-button" id="rollButton" type="button">
            <span aria-hidden="true">🎲</span>
            <span>Lancer les dés</span>
          </button>

          <button
            class="small-button"
            id="copyButton"
            type="button"
            title="Copier le résultat"
            aria-label="Copier le résultat"
          >
            ⧉
          </button>
        </div>

        <div class="footer-note">
          Tu peux aussi appuyer sur la barre d’espace.
        </div>
      </div>

      <div class="settings" id="reglages">
        <div class="setting-block">
          <div class="setting-title">Nombre de dés</div>

          <div class="dice-count" role="group" aria-label="Nombre de dés">
            <button class="count-button" type="button" data-count="2">2</button>
            <button class="count-button active" type="button" data-count="3">3</button>
            <button class="count-button" type="button" data-count="4">4</button>
          </div>
        </div>

        <div class="setting-block">
          <div class="setting-title">Couleurs du jeu</div>

          <div class="colors" aria-label="Couleurs disponibles">
            <div class="color-preview" style="--color:#ff453a" title="Rouge"></div>
            <div class="color-preview" style="--color:#ffd60a" title="Jaune"></div>
            <div class="color-preview" style="--color:#32d74b" title="Vert"></div>
            <div class="color-preview" style="--color:#0a84ff" title="Bleu"></div>
            <div class="color-preview" style="--color:#bf5af2" title="Violet"></div>
            <div class="color-preview" style="--color:#ff9f0a" title="Orange"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/script.js" defer></script>
</body>
</html>
